name: 字幕を取得

# transcripts/queue.txt に動画IDを書いて push すると、その動画の字幕を取得して transcripts/<ID>.txt に保存する
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "transcripts/queue.txt"
      - "scripts/fetch_captions.py"
      - ".github/workflows/fetch-captions.yml"

permissions:
  contents: write

concurrency:
  group: fetch-captions
  cancel-in-progress: false

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yt-dlp を入れる
        run: pip install --quiet yt-dlp
      - name: 字幕を取得
        run: python3 scripts/fetch_captions.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts/*.txt || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "字幕を取得"
            git pull --rebase origin main
            git push
          fi
